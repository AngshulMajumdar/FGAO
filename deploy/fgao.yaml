# FGAO RAG service configuration. Paths are relative to this file.
llm:
  provider: openai                 # openai | anthropic | huggingface | transformers | factory
  model: gpt-4o-mini
  base_url: null                   # set for any OpenAI-compatible server (vLLM, TGI, Ollama, LM Studio)
  api_key_env: OPENAI_API_KEY
  temperature: 0
  max_tokens: 128
  timeout: 30                      # client-side request timeout (s)

resilience:                        # applied to the LLM and to every retriever
  attempts: 3
  backoff: 0.5
  max_backoff: 8
  timeout: 30                      # per attempt (s)
  max_concurrency: 128             # simultaneous calls per process
  rate: null                       # calls per second per process (null = unlimited)

cache: null                        # e.g. {path: /var/cache/fgao/llm.json}

kb:                                # knowledge base: BM25 over a JSONL file ({"text", "title", "id"} per line)
  type: bm25
  path: /data/kb.jsonl
web: null                          # optional second source, e.g. {type: http, url: http://search:9000/search}

budget: 16
on_error: record                   # keep answering when one operation fails after retries

server:
  max_inflight: 256                # queries running at once per worker
  max_queue: 1024                  # queries waiting per worker; beyond this: 429
  request_timeout: 60              # per query (s); beyond this: 504
  max_batch: 256
  api_keys_env: FGAO_API_KEYS      # comma-separated keys; unset = no authentication
